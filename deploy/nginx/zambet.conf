# nginx site for the demo: /etc/nginx/sites-available/zambet
# Replace demo.example.ro with your domain, then run Certbot (see README):
#   sudo certbot --nginx -d demo.example.ro
# Certbot adds the `listen 443 ssl` lines, the certificates and the HTTP->HTTPS redirect.

# Flood protection in front of the chat API; the app enforces the real per-IP limits.
limit_req_zone $binary_remote_addr zone=zambet_chat:10m rate=60r/m;

upstream zambet_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.example.ro;

    client_max_body_size 64k;

    # Overwrite (do not append) X-Forwarded-For: the app trusts it for rate limiting.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://zambet_app;
        proxy_read_timeout 60s;
    }

    # Chat answers are streamed as NDJSON: pass them through as they come.
    location /api/chat {
        limit_req zone=zambet_chat burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://zambet_app;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    # Admin live updates (Server-Sent Events): long-lived, unbuffered.
    location = /api/admin/stream {
        proxy_pass http://zambet_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Versioned assets are already sent with Cache-Control: immutable.
    location /static/ {
        proxy_pass http://zambet_app;
        access_log off;
    }

    # After Certbot has enabled HTTPS, add to the 443 server block:
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
